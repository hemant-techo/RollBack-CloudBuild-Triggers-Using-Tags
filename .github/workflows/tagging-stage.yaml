name: Bump version (stage)
on:
  pull_request:
    types:
      - closed
    branches:
      - stage

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.merge_commit_sha }}
        fetch-depth: '0'

    - name: Bump version
      id: bump_version
      uses: anothrNick/github-tag-action@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        INITIAL_VERSION: 1.0.0
        WITH_V: true
        DEFAULT_BUMP: patch
        PRERELEASE: false
        RELEASE_BRANCHES: stage

    - name: Add custom prefix to tag
      id: add_prefix
      run: |
        NEW_TAG="stage-${{ steps.bump_version.outputs.new_tag }}"
        echo "New tag with prefix: $NEW_TAG"
        echo "new_tag_with_prefix=$NEW_TAG" >> $GITHUB_OUTPUT

    - name: Push custom tag
      run: |
        git tag ${{ steps.add_prefix.outputs.new_tag_with_prefix }}
        git push origin ${{ steps.add_prefix.outputs.new_tag_with_prefix }}